name: release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to build, for example v1.2.3.
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-[0-9]+"

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.90"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-22.04
    outputs:
      release-tag: ${{ steps.version.outputs.release-tag }}

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi

          echo "release-tag=${tag}" >> "${GITHUB_OUTPUT}"

  build-linux:
    name: Build Linux - ${{ matrix.job.name }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64", target: "x86_64-unknown-linux-musl" }
          - { name: "arm64v8", target: "aarch64-unknown-linux-musl" }
          - { name: "armv7", target: "armv7-unknown-linux-musleabihf" }
          - { name: "i386", target: "i686-unknown-linux-musl" }

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v6

      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-tag }}
          path: source
          submodules: recursive

      - name: Build Rust binaries
        uses: ./.github/actions/build-rust-target
        with:
          target: ${{ matrix.job.target }}
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          use-cross: "true"
          working-directory: source

      - name: Make binaries executable
        run: chmod -v a+x source/target/${{ matrix.job.target }}/release/*

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: |
            source/target/${{ matrix.job.target }}/release/hbbr
            source/target/${{ matrix.job.target }}/release/hbbs
            source/target/${{ matrix.job.target }}/release/rustdesk-utils
          if-no-files-found: error

  build-windows:
    name: Build Windows - x86_64
    needs: prepare
    runs-on: windows-2022
    env:
      WINDOWS_TARGET: x86_64-pc-windows-msvc

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v6

      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-tag }}
          path: source
          submodules: recursive

      - name: Build Rust binaries
        uses: ./.github/actions/build-rust-target
        with:
          target: ${{ env.WINDOWS_TARGET }}
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          use-cross: "false"
          working-directory: source

      - name: Install NSIS
        shell: pwsh
        run: |
          iwr -useb get.scoop.sh -outfile install.ps1
          .\install.ps1 -RunAsAdmin
          scoop update
          scoop bucket add extras
          scoop install nsis

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 16

      - name: Build UI browser file
        working-directory: ./source/ui/html
        shell: pwsh
        run: |
          npm i
          npm run build

      - name: Build UI setup file
        working-directory: ./source/ui
        shell: pwsh
        run: |
          rustup default nightly
          cargo build --release
          xcopy /y ..\target\x86_64-pc-windows-msvc\release\*.exe setup\bin\
          xcopy /y target\release\*.exe setup\
          mkdir setup\logs
          makensis /V1 setup.nsi
          mkdir SignOutput
          mv RustDeskServer.Setup.exe SignOutput\
          mv ..\target\x86_64-pc-windows-msvc\release\*.exe SignOutput\

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: binaries-windows-x86_64
          path: |
            source\ui\SignOutput\hbbr.exe
            source\ui\SignOutput\hbbs.exe
            source\ui\SignOutput\rustdesk-utils.exe
            source\ui\SignOutput\RustDeskServer.Setup.exe
          if-no-files-found: error

  release-notes:
    name: Generate release notes
    needs: prepare
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release-tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Generate release notes
        run: |
          cargo run --locked --quiet --bin release-notes -- \
            --tag "${{ needs.prepare.outputs.release-tag }}" \
            --repo-url "https://github.com/${{ github.repository }}" \
            --cwd "${GITHUB_WORKSPACE}" \
            --output release-notes.md \
            --release-date "$(date -u +%F)"

      - name: Upload release notes
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  create-release:
    name: Create GitHub draft release
    needs:
      - prepare
      - release-notes
    runs-on: ubuntu-22.04

    steps:
      - name: Download release notes
        uses: actions/download-artifact@v6
        with:
          name: release-notes
          path: .

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ needs.prepare.outputs.release-tag }}
          body_path: release-notes.md

  release:
    name: GitHub release - ${{ matrix.job.os }} ${{ matrix.job.name }}
    needs:
      - prepare
      - build-linux
      - build-windows
      - create-release
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: "linux", name: "amd64", suffix: "" }
          - { os: "linux", name: "arm64v8", suffix: "" }
          - { os: "linux", name: "armv7", suffix: "" }
          - { os: "linux", name: "i386", suffix: "" }
          - { os: "windows", name: "x86_64", suffix: "-unsigned" }

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v6
        with:
          name: binaries-${{ matrix.job.os }}-${{ matrix.job.name }}
          path: ${{ matrix.job.name }}

      - name: Pack files
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -y zip
          chmod -v a+x ${{ matrix.job.name }}/*
          zip ${{ matrix.job.name }}/rustdesk-server-${{ matrix.job.os }}-${{ matrix.job.name }}${{ matrix.job.suffix }}.zip ${{ matrix.job.name }}/*

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.prepare.outputs.release-tag }}" \
            "${{ matrix.job.name }}/rustdesk-server-${{ matrix.job.os }}-${{ matrix.job.name }}${{ matrix.job.suffix }}.zip" \
            --clobber \
            --repo "${{ github.repository }}"
